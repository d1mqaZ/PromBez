<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142d42"><link rel="manifest" href="manifest.json"><title>ПромБез</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#142d42;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 70px}header{background:#142d42;color:white;padding:18px 20px;font-weight:800;font-size:23px}header small{display:block;font-size:12px;font-weight:400;color:#c5d5e0}section{background:white;border:1px solid #dce5eb;border-radius:16px;padding:20px;margin:14px 0}h1,h2,p{margin:0 0 12px}h1{font-size:25px}h2{font-size:19px}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #ccd8e0}button{cursor:pointer;background:#fff;color:#142d42;min-height:48px}button.primary{background:#176c80;color:white;border:0;font-weight:700}button:disabled{opacity:.5}button.option{display:block;width:100%;text-align:left;margin:9px 0}button.selected{background:#e1f3f6;border:2px solid #176c80}button.good{background:#d9f3e3;border-color:#20864b}button.bad{background:#ffe5e5;border-color:#bd3434}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.muted{color:#607586;font-size:14px}.bar{height:9px;background:#dce5eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#176c80}.big{font-size:30px;font-weight:800}label{display:block;margin:10px 0}input,select{max-width:100%;width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}#msg{color:#a63b24;white-space:pre-wrap}a{color:#176c80}button:focus-visible{outline:3px solid #f1b63c} @media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body><header>ПромБез <small>Тренажёр промышленной безопасности</small></header><main id="app"></main><script src="config.js"></script><script src="questions.js"></script><script>
const Q=window.QUESTIONS, C=window.PROMBEZ||{}, app=document.querySelector('#app'), cloud=!!(C.url&&C.key), cats=['Все','А.1','Б.1.1','Б.1.11'];let user=null, state={}, cat='Все', session=null, busy=false; const day=86400000, today=()=>new Date().toLocaleDateString('sv-SE'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, dateAdd=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}, key=()=> 'prombez:'+user.id;let token='';
async function api(path,method='GET',body,auth=true){let r=await fetch(C.url.replace(/\/$/,'')+path,{method,headers:{apikey:C.key,Authorization:'Bearer '+(auth&&token?token:C.key),'Content-Type':'application/json',Prefer:'return=representation,resolution=merge-duplicates'},...(body?{body:JSON.stringify(body)}:{})});let t=await r.text(),v=t?JSON.parse(t):null;if(!r.ok)throw Error(v?.msg||v?.message||v?.error_description||'Ошибка '+r.status);return v}
function blank(){return {exam:dateAdd(15),progress:{},history:{},tests:[]}}
function local(){try{return JSON.parse(localStorage.getItem(key()))||blank()}catch{return blank()}}
async function save(){localStorage.setItem(key(),JSON.stringify(state));if(cloud){try{await api('/rest/v1/profiles?on_conflict=id','POST',{id:user.id,name:user.name,data:state,learned:learned(Q),seen:Q.filter(q=>state.progress[q.id]).length});document.querySelector('#sync')?.replaceChildren('Синхронизировано')}catch(e){let x=document.querySelector('#sync');if(x)x.textContent='Не удалось синхронизировать: '+e.message;else alert('Прогресс сохранён на устройстве, но не отправлен на сервер: '+e.message)}}}
function learned(qs){return qs.filter(q=>(state.progress[q.id]?.streak||0)>=3).length}function filtered(){return Q.filter(q=>cat==='Все'||q.category===cat)}function remaining(){return Math.max(0,Math.round((new Date(state.exam+'T00:00:00')-new Date(today()+'T00:00:00'))/day))}function due(q){let p=state.progress[q.id];return p&&p.due<=today()}function login(){app.innerHTML=`<section><h1>Вход в тренажёр</h1><p class="muted">${cloud?'Войдите под своей учётной записью.':'Локальный режим: прогресс хранится только на этом устройстве.'}</p><form id="login"><label>${cloud?'Электронная почта':'Имя'}<input id="name" ${cloud?'type="email"':''} required autocomplete="username"></label>${cloud?'<label>Пароль<input id="pass" type="password" required autocomplete="current-password"></label>':''}<button class="primary" type="submit">Войти</button></form><p id="msg"></p></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let n=document.querySelector('#name').value.trim();try{if(cloud){let v=await api('/auth/v1/token?grant_type=password','POST',{email:n,password:document.querySelector('#pass').value},false);token=v.access_token;sessionStorage.setItem('pb-session',JSON.stringify({refresh:v.refresh_token}));user={id:v.user.id,name:v.user.user_metadata?.name||n.split('@')[0]};let p=await api('/rest/v1/profiles?id=eq.'+user.id+'&select=*');state=p[0]?.data||local();user.name=p[0]?.name||user.name}else{user={id:n.toLowerCase(),name:n};state=local();localStorage.setItem('pb-user',JSON.stringify(user))}await save();home()}catch(e){document.querySelector('#msg').textContent=e.message}}}
function home(){session=null;let qs=filtered(),fresh=qs.filter(q=>!state.progress[q.id]),reviews=qs.filter(due),quota=Math.ceil(fresh.length/Math.max(1,remaining()-4));let seen=qs.length-fresh.length,l=learned(qs);app.innerHTML=`<div class="row"><b>${esc(user.name)}</b><button onclick="logout()">Выйти</button></div><section><div class="muted">До экзамена</div><div class="big">${remaining()} дней</div><label>Дата экзамена<input type="date" value="${esc(state.exam)}" onchange="state.exam=this.value;save();home()"></label><label>Раздел<select onchange="cat=this.value;home()">${cats.map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select></label></section><section><h2>Прогресс</h2><div class="big">${seen} / ${qs.length}</div><div class="bar"><i style="width:${100*seen/qs.length}%"></i></div><p class="muted">Закреплено (3 верных подряд): ${l}. На повторение: ${reviews.length}.</p><div id="sync" class="muted">${cloud?'Облачный режим':'Локальное сохранение'}</div></section><section><h2>Задание на сегодня</h2><p>${quota} новых · ${reviews.length} повторений</p><p class="muted">Сегодня отвечено: ${state.history[today()]||0}</p><button class="primary" style="width:100%" onclick="start('daily')">Начать обучение</button></section><div class="grid"><button onclick="start('errors')">Работа над ошибками</button><button onclick="start('exam')">Пробный экзамен</button><button onclick="start('all')">Все вопросы</button><button onclick="rating()">Рейтинг друзей</button><button onclick="stats()">Статистика</button></div><p class="muted" style="margin-top:16px">Ответы перенесены из исходных PDF. Актуальность нормативов отдельно не проверена. Пробный экзамен: учебный формат, 20 вопросов / 20 минут.</p>`}
function logout(){localStorage.removeItem('pb-user');sessionStorage.removeItem('pb-session');token='';user=null;login()}
function start(mode){let qs=filtered(), list=mode==='daily'?[...shuffle(qs.filter(due)),...shuffle(qs.filter(q=>!state.progress[q.id])).slice(0,Math.ceil(qs.filter(q=>!state.progress[q.id]).length/Math.max(1,remaining()-4)))]:mode==='errors'?shuffle(qs.filter(q=>state.progress[q.id]?.wrong>0&&state.progress[q.id]?.streak<3)):mode==='exam'?shuffle(qs).slice(0,20):shuffle(qs);if(!list.length){alert('Нет вопросов для этого режима');return}session={mode,list,i:0,correct:0,total:0,chosen:[],checked:false,deadline:Date.now()+20*60000,results:[]};show()}
function show(){let s=session,q=s.list[s.i];if(!q){finish();return}let exam=s.mode==='exam';if(exam&&Date.now()>=s.deadline){finish();return}let order= /(?:все|всё|перечислен|выше|ниже|вариант[ыа]?\s*[а-я0-9])/i.test(q.options.join(' '))?q.options.map((_,i)=>i):shuffle(q.options.map((_,i)=>i));s.order=order;s.chosen=[];s.checked=false;app.innerHTML=`<div class="row"><button onclick="if(confirm('Выйти из тренировки?'))home()">На главную</button><span class="muted">${s.i+1} / ${s.list.length} · ${esc(q.category)}</span></div><section><p class="muted">${q.correct.length>1?'Выберите несколько ответов':'Выберите один ответ'} ${exam?' · <span id="timer"></span>':''}</p><h2>${esc(q.question)}</h2><div id="options">${order.map(i=>`<button class="option" id="o${i}" onclick="choose(${i})" aria-pressed="false">${esc(q.options[i])}</button>`).join('')}</div><div id="feedback"></div><button id="submit" class="primary" style="width:100%;margin-top:10px" onclick="answer()" disabled>Ответить</button></section>`;tick()}
function choose(i){let s=session,q=s.list[s.i];if(s.checked)return;if(q.correct.length===1)s.chosen=[i];else s.chosen=s.chosen.includes(i)?s.chosen.filter(x=>x!==i):[...s.chosen,i];for(let j of s.order){let b=document.querySelector('#o'+j);b.classList.toggle('selected',s.chosen.includes(j));b.setAttribute('aria-pressed',s.chosen.includes(j))}document.querySelector('#submit').disabled=!s.chosen.length}
function answer(){let s=session,q=s.list[s.i];if(s.checked||!s.chosen.length)return;let ok=q.correct.length===s.chosen.length&&q.correct.every(i=>s.chosen.includes(i));s.checked=true;s.total++;s.correct+=ok?1:0;s.results.push({q,ok,chosen:[...s.chosen]});let p=state.progress[q.id]||{streak:0,wrong:0,attempts:0};p.attempts++;p.streak=ok?p.streak+1:0;p.wrong+=ok?0:1;p.due=dateAdd(ok?([1,3,7][Math.min(2,p.streak-1)]):0);state.progress[q.id]=p;state.history[today()]=(state.history[today()]||0)+1;save();if(s.mode==='exam'){s.i++;show();return}for(let j of s.order){let b=document.querySelector('#o'+j);b.disabled=true;if(q.correct.includes(j))b.classList.add('good');else if(s.chosen.includes(j))b.classList.add('bad')}document.querySelector('#feedback').innerHTML=`<p><b>${ok?'Верно!':'Ошибка. Правильный ответ выделен зелёным.'}</b></p><p class="muted">Источник: ${esc(q.category)}, стр. ${q.page}.</p>`;if(!ok&&s.mode==='daily'&&s.list.filter(x=>x.id===q.id).length<3)s.list.splice(Math.min(s.list.length,s.i+6),0,q);let b=document.querySelector('#submit');b.textContent='Далее';b.onclick=()=>{s.i++;show()}}
function tick(){let t=document.querySelector('#timer');if(!t||!session||session.mode!=='exam')return;let n=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));t.textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(!n)finish()}setInterval(tick,1000);
function finish(){let s=session;if(!s)return;let exam=s.mode==='exam',total=exam?s.list.length:s.total;state.tests.push({date:today(),mode:s.mode,category:cat,correct:s.correct,total});save();session=null;app.innerHTML=`<section><h1>Результат</h1><div class="big">${s.correct} / ${total}</div><p>${total?Math.round(s.correct/total*100):0}% правильных ответов</p><button class="primary" onclick="home()">На главную</button></section>${s.results.filter(r=>!r.ok).map(r=>`<section><b>${esc(r.q.question)}</b><p>Ваш ответ: ${r.chosen.map(i=>esc(r.q.options[i])).join('; ')}</p><p>Правильно: ${r.q.correct.map(i=>esc(r.q.options[i])).join('; ')}</p><small>Источник: ${esc(r.q.category)}, стр. ${r.q.page}</small></section>`).join('')}`}
function stats(){app.innerHTML=`<button onclick="home()">На главную</button><section><h2>Активность</h2>${Object.entries(state.history).sort().reverse().map(([d,n])=>`<p>${esc(d)} — ${n} ответов</p>`).join('')||'Пока нет ответов'}</section><section><h2>Результаты тренировок</h2>${state.tests.slice().reverse().map(t=>`<p>${esc(t.date)} · ${esc(t.category)} · ${t.correct}/${t.total}</p>`).join('')||'Пока нет завершённых тренировок'}</section>`}
async function rating(){app.innerHTML='<button onclick="home()">На главную</button><section id="rank">Загрузка…</section>';let el=document.querySelector('#rank');try{let rows=cloud?await api('/rest/v1/leaderboard?select=name,learned,seen&order=learned.desc,seen.desc'):Object.keys(localStorage).filter(k=>k.startsWith('prombez:')).map(k=>{let d=JSON.parse(localStorage.getItem(k)),p=Object.values(d.progress);return {name:k.slice(8),learned:p.filter(x=>x.streak>=3).length,seen:p.length}}).sort((a,b)=>b.learned-a.learned||b.seen-a.seen);el.innerHTML='<h2>Рейтинг</h2><p class="muted">'+(cloud?'Общий рейтинг группы':'Только участники на этом устройстве')+'</p>'+rows.map((r,i)=>`<p>${i+1}. <b>${esc(r.name)}</b> — закреплено ${r.learned}, изучено ${r.seen}</p>`).join('')}catch(e){el.textContent=e.message}}
(async()=>{if(cloud){try{let x=JSON.parse(sessionStorage.getItem('pb-session'));if(x?.refresh){let v=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:x.refresh},false);token=v.access_token;sessionStorage.setItem('pb-session',JSON.stringify({refresh:v.refresh_token}));user={id:v.user.id,name:v.user.user_metadata?.name||v.user.email.split('@')[0]};let p=await api('/rest/v1/profiles?id=eq.'+user.id+'&select=*');state=p[0]?.data||local();user.name=p[0]?.name||user.name;home();return}}catch{}}else{try{user=JSON.parse(localStorage.getItem('pb-user'));if(user){state=local();home();return}}catch{}}login()})();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
